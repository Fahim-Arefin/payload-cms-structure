services:
  app:
    image: node:22-alpine
    container_name: xynolab-website-dev
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm install && pnpm dev"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:

# Daily dev commands:
# Start dev server with hot reload: docker compose up
# Start in background: docker compose up -d
# View logs: docker compose logs -f app
# Stop dev server: docker compose down
# Recreate dependency/cache volumes: docker compose down -v
