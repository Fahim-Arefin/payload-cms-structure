name: Deploy SagarRope (SSH)

on:
  push:
    branches:
      # - main
      - staging

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SAGARROPE_SERVER_IP }}
          username: ${{ secrets.SAGARROPE_SERVER_USERNAME }}
          password: ${{ secrets.SAGARROPE_SERVER_PASSWORD }}
          port: ${{ secrets.SAGARROPE_SERVER_PORT }}
          script: |
            set -e

            if [ "${{ github.ref_name }}" = "main" ]; then
              ENV="main"
            else
              ENV="staging"
            fi

            PNPM_BIN="/home/sagarrope/.nvm/versions/node/v24.11.0/bin/pnpm"
            [ -x "$PNPM_BIN" ] || { echo "pnpm not executable at $PNPM_BIN"; exit 1; }

            echo "Deploying environment: $ENV (branch: ${{ github.ref_name }})"

            cd "$HOME/projects/sagarrope-$ENV" && \
            git pull origin "$ENV" && \
            "$PNPM_BIN" i --frozen-lockfile && \
            "$PNPM_BIN" build && \
            pm2 reload "sagarrope-$ENV" && \
            pm2 status
