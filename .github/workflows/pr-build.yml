name: Docker PR Build

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Recommended for advanced features like multi-platform builds and caching
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for PR
        uses: docker/build-push-action@v6
        with:
          context: .
          # Load the image to the local Docker daemon for subsequent testing steps (optional)
          load: true
          tags: shantalife:pr-${{ github.event.pull_request.number }}
          # Do NOT push to a registry on a PR event
          push: false
