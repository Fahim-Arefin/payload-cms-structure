name: PNPM Build

on:
  pull_request:
    branches:
      - develop
      - main
      - staging

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.19.0'

      - name: Install pnpm
        run: |
          npm install -g pnpm

      # - name: Install dependencies
      #   run: pnpm install

      - name: Run build
        run: pnpm build
