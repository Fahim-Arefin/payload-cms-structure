name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
      # - staging

jobs:
  build_and_deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Create .env from ENV_FILE secret
        run: |
          if ${{ github.ref == 'refs/heads/main' }}; then
            cat > .env << 'EOF'
          ${{ secrets.ENV_FILE_MAIN }}
          EOF
          else
            cat > .env << 'EOF'
          ${{ secrets.ENV_FILE_STAGING }}
          EOF
          fi

      - name: Build Docker image
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          if ${{ github.ref == 'refs/heads/main' }}; then
            BRANCH='main'
          else
            BRANCH='staging'
          fi

          docker build --progress=plain \
            -f Dockerfile \
            -t shantalife:$IMAGE_TAG \
            -t shantalife:$BRANCH-latest .

      - name: Deploy to servers
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          mkdir -p ~/.ssh/shanta-life

          if ${{ github.ref == 'refs/heads/main' }}; then
            BRANCH='main'
            PORT=${{ secrets.SERVER_PORT_MAIN }}
            SERVER_IP_LIST=${{ secrets.SERVER_IP_LIST_MAIN }}
            printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY_MAIN }}" > ~/.ssh/shanta-life/id_rsa
          else
            BRANCH='staging'
            PORT=${{ secrets.SERVER_PORT_STAGING }}
            SERVER_IP_LIST=${{ secrets.SERVER_IP_LIST_STAGING }}
            printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY_STAGING }}" > ~/.ssh/shanta-life/id_rsa
          fi
          mediaVolumeDir="/home/ubuntu/dockerVolumes/shantalife_$BRANCH/media"
          resumesVolumeDir="/home/ubuntu/dockerVolumes/shantalife_$BRANCH/resumes"

          chmod 600 ~/.ssh/shanta-life/id_rsa

          docker save -o shantalife.tar shantalife:$IMAGE_TAG shantalife:$BRANCH-latest

          for SERVER_IP in $(echo $SERVER_IP_LIST | tr ',' '\n'); do
            echo "Deploying to $SERVER_IP"

            ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

            scp -i ~/.ssh/shanta-life/id_rsa shantalife.tar ubuntu@$SERVER_IP:/tmp

            ssh -i ~/.ssh/shanta-life/id_rsa ubuntu@$SERVER_IP <<EOF

              [ ! -d "$mediaVolumeDir" ] && mkdir -p "$mediaVolumeDir"
              [ ! -d "$resumesVolumeDir" ] && mkdir -p "$resumesVolumeDir"

              docker images -q --filter "reference=shantalife" | xargs -r docker rmi -f
              docker load -i /tmp/shantalife.tar
              docker ps -q --filter name=shantalife-$BRANCH | xargs -r docker stop
              docker ps -a -q --filter "name=shantalife-$BRANCH" | xargs -r docker rm

              docker run -d --restart=always -v $mediaVolumeDir:/app/media -v $resumesVolumeDir:/app/resumes -p $PORT:3000 --name shantalife-$BRANCH shantalife:$BRANCH-latest

              docker image prune -a -f

              rm -f /tmp/shantalife.tar
          EOF
          done

          rm -f ~/.ssh/shanta-life/id_rsa
          rm -f shantalife.tar

          docker images -q --filter "dangling=true" | xargs -r docker rmi -f
          docker images -q --filter "reference=shantalife" | xargs -r docker rmi -f
          docker container prune -f
          docker volume ls -q --filter dangling=true | xargs -r docker volume rm -f
