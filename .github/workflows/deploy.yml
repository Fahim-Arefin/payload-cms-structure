name: Deploy ShantaLife (SSH)

on:
  push:
    branches:
      - main
      - staging

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SHANTA_SERVER_IP }}
          username: ${{ secrets.SHANTA_SERVER_USERNAME }}
          password: ${{ secrets.SHANTA_SERVER_PASSWORD }}
          script: |
            set -e

            echo "${{ github.ref_name }}"
            echo "${BRANCH}"
            echo "${{ github.ref_name }}"
            # if [ "${BRANCH}" = "main" ]; then
            #   ENV="main"
            # else
            #   ENV="staging"
            # fi

            echo "Deploying environment: $BRANCH (branch: ${BRANCH})"

            ./.bin/deploy-shantalife "$BRANCH"
