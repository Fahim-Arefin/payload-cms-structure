name: Deploy ShantaLife (SSH)

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SHANTA_SERVER_IP }}
          username: ${{ secrets.SHANTA_SERVER_USERNAME }}
          password: ${{ secrets.SHANTA_SERVER_PASSWORD }}
          script: |
            set -e

            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              ENV="main"
            else
              ENV="staging"
            fi

            echo "Deploying environment: $ENV (branch: ${GITHUB_REF_NAME})"

            ./.bin/deploy-shantalife "$ENV"
