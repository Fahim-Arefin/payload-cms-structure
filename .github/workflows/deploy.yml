name: Deploy via SSH

on:
  push:
    branches:
      # - main
      - staging

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 120m
          command_timeout: 60m
          script: |
            set -e

            if [ "${{ github.ref_name }}" = "main" ]; then
              ENV="main"
            else
              ENV="staging"
            fi

            echo "Deploying environment: $ENV (branch: ${{ github.ref_name }})"

            ./.bin/deploy-shantalife "$ENV"
